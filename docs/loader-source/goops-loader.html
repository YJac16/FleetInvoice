            .goops-loader__breathe {

              transform-origin: center;
              animation: goops-loader-breathe 1.2s ease-in-out infinite;

            .goops-loader__orbit {
              transform-box: fill-box;
              transform-origin: center;
              animation: goops-loader-spin 1.2s linear infinite;
            }
            @keyframes goops-loader-breathe {
              0%, 100% { transform: scale(1); }
              50% { transform: scale(1.03); }
            }
            @keyframes goops-loader-spin {
              from { transform: rotate(0deg); }
              to { transform: rotate(360deg); }
            }
            @media (prefers-reduced-motion: reduce) {
              .goops-loader__breathe,
              .goops-loader__orbit {
                animation: none !important;
              }
              .goops-loader__orbit {
                display: none;

    <script>
      (function () {
        var params = new URLSearchParams(window.location.search);
        if (params.has("preview")) {
          document.body.classList.add("is-preview");
        }
        var size = params.get("size");
        if (size) {
          document.documentElement.style.setProperty("--goops-loader-size", /px$/.test(size) ? size : size + "px");

      })();
